# FREQUENCY-ORIENTED configuration profile.
#
# Goal: move from the strict baseline's ~15 trades/5yr toward a
# multiple-trades-per-day cadence, using only two honest, measurable
# levers plus modest threshold loosening -- NOT by hardcoding a target
# win-rate or return (that would be exactly the "make the backtest
# look good" behavior we're avoiding).
#
#   1) min_core_filters_required: 3   -> majority vote (3 of 5 core
#      signal components) instead of requiring all 5.
#   2) max_concurrent_baskets: 3      -> up to 3 independent grid
#      baskets open on the same symbol at once, instead of forcing the
#      engine to sit idle until the previous basket fully closes.
#   3) timeframe: M15 instead of H1  -> ~4x more bars -> more distinct
#      setups per day, at the cost of more noise per setup.
#   4) A handful of thresholds loosened moderately (session widened,
#      RSI/Stochastic bands narrowed, ADX ceiling raised, BB std
#      lowered, EMA200 distance requirement reduced).
#
# IMPORTANT: loosening selectivity is a real trade-off, not a free
# lunch. Expect a lower win rate and larger drawdowns than the strict
# baseline -- that's the honest cost of trading more often. Run this,
# read the DIAGNOSTICS block in the report, and re-tune deliberately;
# don't just crank every knob further because the first run wasn't
# profitable enough. That path leads straight to overfitting the exact
# backtest window you're staring at, which produces numbers that will
# not survive contact with live trading.
#
# Run it with:
#   python run_backtest.py --config config/frequency.yaml --symbol EURGBP --start-year 2020 --end-year 2024

symbol: EURGBP
timeframe: M15
start_year: 2020
end_year: 2024

initial_balance: 10000.0
base_lot: 0.01
compound_sizing: true
lot_progression: [1.00, 1.30, 1.70, 2.20, 2.80, 3.60, 4.60]
max_positions: 7
max_concurrent_baskets: 3
min_core_filters_required: 3     # majority vote: 3 of 5 core filters

spread_pips: 1.2
spread_filter_mult: 2.0
off_session_spread_mult: 1.8
commission_per_lot_roundturn: 7.0
slippage_pips: 0.5

grid_atr_mult_quiet: 0.8
grid_atr_mult_normal: 1.0
grid_atr_mult_high: 1.3
atr_extreme_ratio: 1.8

rsi_period: 14
rsi_oversold: 35.0                # loosened from 30
rsi_overbought: 65.0              # loosened from 70
stoch_k: 14
stoch_d: 3
stoch_smooth: 3
stoch_oversold: 25.0              # loosened from 20
stoch_overbought: 75.0            # loosened from 80
bb_period: 20
bb_std: 1.6                       # narrower bands from 2.0 -> "outside BB" happens more often
adx_period: 14
adx_entry_max: 30.0               # loosened from 25
atr_period: 14
ema_fast: 50
ema_slow: 200
ema200_min_dist_pips: 3.0         # loosened from 5.0
use_vwap_filter: false
vwap_min_dist_pips: 3.0

recovery_stat_limit_atr: 4.0
breakout_atr_spike_ratio: 1.6
adx_surge_delta: 8.0

basket_tp_atr_mult: 1.6           # NOT 1.0: at spread=1.2pips + slippage=0.5pips*2 +
                                    # commission~0.7pip-equivalent, round-trip cost floor
                                    # is ~2.9 pips regardless of lot size (cost scales
                                    # with lots exactly like gross profit does). 1.6x ATR
                                    # gives real margin above that floor instead of trading
                                    # at breakeven-or-worse on every "successful" TP exit.
partial_close_pct: 0.5
partial_close_trigger_frac_of_tp: 0.6
momentum_exhaustion_rsi_buffer: 5.0

max_floating_dd_pct: 12.0         # tightened vs baseline since we now run more baskets at once
max_daily_loss_pct: 5.0
max_weekly_loss_pct: 10.0
max_margin_util_pct: 60.0
leverage: 30.0

session_start_hour_utc: 3         # widened: Asia-late + London + NY
session_end_hour_utc: 21
avoid_friday_after_hour_utc: 19

enable_trend_single_trade: false

regime:
  adx_trend_threshold: 25.0
  adx_range_threshold: 20.0
  atr_expand_lookback: 20
  atr_expand_ratio: 1.15
  ema_slope_lookback: 10
  ema_slope_threshold_pips: 3.0
