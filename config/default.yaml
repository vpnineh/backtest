# Default backtest configuration.
# Every value here can be overridden from the CLI, e.g.:
#   python run_backtest.py --symbol AUDNZD --timeframe M15 --start-year 2018 --end-year 2023
#
# Nothing in this file was fit/optimized against the backtest data --
# these are fixed, spec-driven defaults.

symbol: EURGBP          # EURGBP or AUDNZD
timeframe: H1            # M1, M5, M15, M30, H1, H4, D1
start_year: 2020
end_year: 2024

initial_balance: 10000.0
base_lot: 0.01
compound_sizing: true
lot_progression: [1.00, 1.30, 1.70, 2.20, 2.80, 3.60, 4.60]
max_positions: 7

spread_pips: 1.2
spread_filter_mult: 2.0
off_session_spread_mult: 1.8
commission_per_lot_roundturn: 7.0
slippage_pips: 0.5

grid_atr_mult_quiet: 0.8
grid_atr_mult_normal: 1.0
grid_atr_mult_high: 1.3
atr_extreme_ratio: 1.8

rsi_period: 14
rsi_oversold: 30.0
rsi_overbought: 70.0
stoch_k: 14
stoch_d: 3
stoch_smooth: 3
stoch_oversold: 20.0
stoch_overbought: 80.0
bb_period: 20
bb_std: 2.0
adx_period: 14
adx_entry_max: 25.0
atr_period: 14
ema_fast: 50
ema_slow: 200
ema200_min_dist_pips: 5.0
use_vwap_filter: false
vwap_min_dist_pips: 3.0

recovery_stat_limit_atr: 4.0
breakout_atr_spike_ratio: 1.6
adx_surge_delta: 8.0

basket_tp_atr_mult: 1.2
partial_close_pct: 0.5
partial_close_trigger_frac_of_tp: 0.6
momentum_exhaustion_rsi_buffer: 5.0

max_floating_dd_pct: 15.0
max_daily_loss_pct: 5.0
max_weekly_loss_pct: 10.0
max_margin_util_pct: 60.0
leverage: 30.0

session_start_hour_utc: 7
session_end_hour_utc: 17
avoid_friday_after_hour_utc: 19

enable_trend_single_trade: false

regime:
  adx_trend_threshold: 25.0
  adx_range_threshold: 20.0
  atr_expand_lookback: 20
  atr_expand_ratio: 1.15
  ema_slope_lookback: 10
  ema_slope_threshold_pips: 3.0
