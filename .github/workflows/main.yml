name: Professional Forex Backtest

# فقط حالت دستی فعال است
on:
  workflow_dispatch: 

jobs:
  run-strategy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas backtrader

    - name: Run Backtest Pipeline
      run: |
        python -u main.py | tee backtest_report.txt

    - name: Upload Backtest Report
      uses: actions/upload-artifact@v4
      with:
        name: Backtest-Results
        path: backtest_report.txt
        retention-days: 7
