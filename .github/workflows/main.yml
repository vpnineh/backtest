name: Algorithmic Trading Backtest

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  # امکان اجرای دستی از پنل گیتهاب
  workflow_dispatch:

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy matplotlib
        
    - name: Run Backtest Engine
      run: python backtest.py
      
    - name: Upload Backtest Artifacts
      if: always() # حتی اگر کد خطا داد، فایل‌ها را آپلود کن
      uses: actions/upload-artifact@v3
      with:
        name: backtest-results
        path: |
          equity_curve.png
          trades_log.csv
