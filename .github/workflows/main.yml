name: Backtest EA

on:
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Run in debug mode'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  # ============================================================
  # JOB 1: DEBUG (اختیاری)
  # ============================================================
  debug:
    runs-on: ubuntu-latest
    if: github.event.inputs.debug_mode == 'true' || github.ref == 'refs/heads/debug'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy
    
    - name: Data inspection
      run: |
        echo "## 📁 Data Files" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        ls -lh data/ | head -20 >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        
        echo "## 📄 Sample Data Format" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        head -5 data/DAT_ASCII_EURUSD_M1_2010.csv >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
    
    - name: Run debug
      run: python main_debug.py
      continue-on-error: true
    
    - name: Show results
      if: always()
      run: |
        echo "## 🔍 Debug Results" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        cat debug.log >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
    
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug-logs
        path: debug.log

  # ============================================================
  # JOB 2: FULL BACKTEST
  # ============================================================
  backtest:
    runs-on: ubuntu-latest
    needs: [debug]
    if: always() && (needs.debug.result == 'success' || needs.debug.result == 'skipped')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create results directory
      run: mkdir -p results
    
    - name: Run backtest
      run: python main.py
      continue-on-error: false
    
    - name: Upload results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backtest-results
        path: results/
        retention-days: 30
    
    - name: Generate summary
      if: always()
      run: |
        echo "# 📊 Backtest Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -f results/summary.json ]; then
          echo "## ✅ Results Generated Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          python << 'EOF' >> $GITHUB_STEP_SUMMARY
        import json
        
        with open('results/summary.json') as f:
            results = json.load(f)
        
        print("| Symbol-Mode | Net Profit % | Profit Factor | Max DD % | Sharpe | Win Rate % | Trades |")
        print("|-------------|--------------|---------------|----------|--------|------------|--------|")
        
        for key, metrics in results.items():
            print(f"| {key} | "
                  f"{metrics.get('net_profit_pct', 0):.2f}% | "
                  f"{metrics.get('profit_factor', 0):.2f} | "
                  f"{metrics.get('max_drawdown_pct', 0):.2f}% | "
                  f"{metrics.get('sharpe_ratio', 0):.2f} | "
                  f"{metrics.get('win_rate', 0):.1f}% | "
                  f"{metrics.get('total_trades', 0)} |")
        EOF
        else
          echo "## ⚠️ No results found" >> $GITHUB_STEP_SUMMARY
        fi
    
    - name: Validate results
      if: success()
      run: |
        python << 'EOF'
        import json
        import sys
        
        print("\n" + "="*60)
        print("VALIDATION CHECK")
        print("="*60)
        
        with open('results/summary.json') as f:
            results = json.load(f)
        
        passed = []
        failed = []
        
        for key, metrics in results.items():
            pf = metrics.get('profit_factor', 0)
            dd = metrics.get('max_drawdown_pct', 100)
            sharpe = metrics.get('sharpe_ratio', 0)
            trades = metrics.get('total_trades', 0)
            
            print(f"\n{key}:")
            
            if pf >= 1.2:
                print(f"  ✅ PF {pf:.2f}")
            else:
                print(f"  ❌ PF {pf:.2f} < 1.2")
                failed.append(f"{key}: Low PF")
            
            if dd <= 20:
                print(f"  ✅ DD {dd:.2f}%")
            else:
                print(f"  ❌ DD {dd:.2f}% > 20%")
                failed.append(f"{key}: High DD")
            
            if sharpe >= 0.5:
                print(f"  ✅ Sharpe {sharpe:.2f}")
            else:
                print(f"  ❌ Sharpe {sharpe:.2f} < 0.5")
                failed.append(f"{key}: Low Sharpe")
            
            if trades >= 50:
                print(f"  ✅ Trades {trades}")
            else:
                print(f"  ⚠️  Trades {trades} < 50")
            
            if not failed or key not in [f.split(':')[0] for f in failed]:
                passed.append(key)
        
        print("\n" + "="*60)
        print(f"SUMMARY: {len(passed)} passed, {len(failed)} failed")
        print("="*60)
        
        if failed:
            print("\n❌ FAILED:")
            for f in failed:
                print(f"  • {f}")
            sys.exit(1)
        else:
            print("\n✅ ALL PASSED")
        EOF
