name: Algorithmic Trading Backtest

# فقط اجرای دستی از طریق پنل گیت‌هاب
on:
  workflow_dispatch:

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy matplotlib
        
    - name: Run Backtest Engine
      run: python -u backtest.py
      
    - name: Upload Backtest Artifacts
      if: always() # حتی اگر کد خطا داد، فایل‌ها را آپلود کن
      uses: actions/upload-artifact@v4
      with:
        name: backtest-results
        path: |
          equity_curve.png
          trades_log.csv
        retention-days: 30
