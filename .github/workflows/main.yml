name: Professional Martingale Strategy Backtest

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: false
        default: '2018-01-01'
      end_date:
        description: 'End date (YYYY-MM-DD)'
        required: false
        default: '2024-12-31'
      pairs:
        description: 'Pairs to test (space separated)'
        required: false
        default: 'EURGBP AUDNZD'
      years:
        description: 'Specific years (space separated, empty = all)'
        required: false
        default: ''
      initial_capital:
        description: 'Initial capital in USD'
        required: false
        default: '10000'
      log_level:
        description: 'Log level'
        required: false
        default: 'INFO'
        type: choice
        options:
          - INFO
          - DEBUG
          - WARNING

  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'config.py'
      - 'main.py'
      - 'requirements.txt'
      - '.github/workflows/backtest.yml'

  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'config.py'
      - 'main.py'

  schedule:
    - cron: '0 2 * * 0'

concurrency:
  group: backtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Unit Tests
  # ─────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (No Look-Ahead Verification)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-html

      - name: Verify key packages
        run: |
          python -c "
          import pandas as pd
          import numpy as np
          import matplotlib
          print(f'pandas:     {pd.__version__}')
          print(f'numpy:      {np.__version__}')
          print(f'matplotlib: {matplotlib.__version__}')
          print('All packages OK')
          "

      - name: Run unit tests
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --html=test-report.html \
            --self-contained-html

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: |
            test-report.html
            coverage.xml
          retention-days: 30

      - name: Check coverage
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          rate = float(root.attrib.get('line-rate', 0)) * 100
          print(f'Coverage: {rate:.1f}%')
          if rate < 50:
              print('WARNING: Coverage below 50%')
          else:
              print('Coverage OK')
          "

  # ─────────────────────────────────────────────
  # JOB 2: Prepare & Validate Data
  # ─────────────────────────────────────────────
  prepare-data:
    name: Prepare & Validate Data
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 30

    outputs:
      data_available: ${{ steps.check_data.outputs.available }}
      eurgbp_years:   ${{ steps.check_data.outputs.eurgbp_years }}
      audnzd_years:   ${{ steps.check_data.outputs.audnzd_years }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check data files
        id: check_data
        run: |
          python - <<'EOF'
          import os
          import json

          data_dir = "data"
          pairs    = ["EURGBP", "AUDNZD"]
          result   = {}
          all_ok   = True

          if not os.path.isdir(data_dir):
              print(f"ERROR: data directory not found: {data_dir}")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write("available=false\n")
                  f.write("eurgbp_years=[]\n")
                  f.write("audnzd_years=[]\n")
              exit(0)

          for pair in pairs:
              years_found = []
              for year in range(2010, 2026):
                  patterns = [
                      f"{data_dir}/HISTDATA_COM_ASCII_{pair}_M1{year}.zip",
                      f"{data_dir}/HISTDATA_COM_ASCII_{pair}_M12{str(year)[1:]}.zip",
                      f"{data_dir}/DAT_ASCII_{pair}_M1_{year}.csv",
                  ]
                  for p in patterns:
                      if os.path.exists(p) and os.path.getsize(p) > 1000:
                          years_found.append(year)
                          break

              result[pair] = sorted(years_found)
              print(f"{pair}: {len(years_found)} years → {years_found}")
              if len(years_found) == 0:
                  all_ok = False

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"available={'true' if all_ok else 'false'}\n")
              f.write(f"eurgbp_years={json.dumps(result.get('EURGBP', []))}\n")
              f.write(f"audnzd_years={json.dumps(result.get('AUDNZD', []))}\n")

          if not all_ok:
              print("WARNING: Some pairs have no data - backtest will be skipped")
          EOF

      - name: Validate CSV format
        if: steps.check_data.outputs.available == 'true'
        run: |
          python - <<'EOF'
          import os
          import zipfile

          data_dir = "data"
          errors   = []
          checked  = 0

          for filename in sorted(os.listdir(data_dir)):
              if "EURGBP" not in filename and "AUDNZD" not in filename:
                  continue
              if not (filename.endswith('.zip') or filename.endswith('.csv')):
                  continue

              filepath = os.path.join(data_dir, filename)
              try:
                  if filename.endswith('.zip'):
                      with zipfile.ZipFile(filepath) as zf:
                          csv_files = [n for n in zf.namelist()
                                       if n.lower().endswith('.csv')]
                          if not csv_files:
                              errors.append(f"{filename}: No CSV in ZIP")
                              continue
                          with zf.open(csv_files[0]) as f:
                              content = f.read(2048).decode('utf-8', errors='replace')
                  else:
                      with open(filepath, 'r', errors='replace') as f:
                          content = f.read(2048)

                  lines = [l.strip() for l in content.split('\n') if l.strip()]
                  if lines:
                      first = lines[0]
                      sep   = ';' if ';' in first else ','
                      parts = first.split(sep)
                      if len(parts) < 5:
                          errors.append(f"{filename}: Bad columns ({len(parts)}): {first[:60]}")
                      else:
                          checked += 1
                          print(f"  OK [{checked}]: {filename}")

              except Exception as e:
                  errors.append(f"{filename}: {e}")

          if errors:
              print(f"\n{len(errors)} ERROR(S):")
              for e in errors:
                  print(f"  ❌ {e}")
          else:
              print(f"\nAll {checked} files validated OK ✅")
          EOF

  # ─────────────────────────────────────────────
  # JOB 3: Backtest
  # ─────────────────────────────────────────────
  backtest:
    name: Run Backtest
    runs-on: ubuntu-latest
    needs: prepare-data
    if: needs.prepare-data.outputs.data_available == 'true'
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify installation
        run: |
          python -c "
          import pandas as pd
          import numpy as np
          import matplotlib
          import scipy
          import tqdm
          print('pandas:     ', pd.__version__)
          print('numpy:      ', np.__version__)
          print('matplotlib: ', matplotlib.__version__)
          print('scipy:      ', scipy.__version__)
          print('tqdm:       ', tqdm.__version__)
          print()
          print('All dependencies OK ✅')
          "

      - name: Create output directory
        run: mkdir -p results

      - name: Set backtest parameters
        id: params
        run: |
          START="${{ github.event.inputs.start_date || '2018-01-01' }}"
          END="${{ github.event.inputs.end_date || '2024-12-31' }}"
          PAIRS="${{ github.event.inputs.pairs || 'EURGBP AUDNZD' }}"
          CAPITAL="${{ github.event.inputs.initial_capital || '10000' }}"
          LOGLEVEL="${{ github.event.inputs.log_level || 'INFO' }}"
          YEARS="${{ github.event.inputs.years || '' }}"

          echo "start=$START"       >> $GITHUB_OUTPUT
          echo "end=$END"           >> $GITHUB_OUTPUT
          echo "pairs=$PAIRS"       >> $GITHUB_OUTPUT
          echo "capital=$CAPITAL"   >> $GITHUB_OUTPUT
          echo "log_level=$LOGLEVEL">> $GITHUB_OUTPUT
          echo "years=$YEARS"       >> $GITHUB_OUTPUT

          echo "=== Backtest Parameters ==="
          echo "  Start:   $START"
          echo "  End:     $END"
          echo "  Pairs:   $PAIRS"
          echo "  Capital: \$$CAPITAL"
          echo "  Years:   ${YEARS:-all}"

      - name: Run backtest
        id: run_backtest
        run: |
          CMD="python main.py"
          CMD="$CMD --data-dir data"
          CMD="$CMD --start ${{ steps.params.outputs.start }}"
          CMD="$CMD --end ${{ steps.params.outputs.end }}"
          CMD="$CMD --capital ${{ steps.params.outputs.capital }}"
          CMD="$CMD --output-dir results"
          CMD="$CMD --log-level ${{ steps.params.outputs.log_level }}"
          CMD="$CMD --pairs ${{ steps.params.outputs.pairs }}"

          YEARS="${{ steps.params.outputs.years }}"
          if [ -n "$YEARS" ]; then
            CMD="$CMD --years $YEARS"
          fi

          echo "Command: $CMD"
          echo "────────────────────────────────────"

          START_TS=$(date +%s)
          $CMD 2>&1 | tee results/backtest_output.log
          EXIT_CODE=${PIPESTATUS[0]}
          END_TS=$(date +%s)
          ELAPSED=$((END_TS - START_TS))

          echo "elapsed_seconds=$ELAPSED" >> $GITHUB_OUTPUT
          echo "exit_code=$EXIT_CODE"     >> $GITHUB_OUTPUT
          echo "────────────────────────────────────"
          echo "Completed in ${ELAPSED}s | Exit: $EXIT_CODE"

          exit $EXIT_CODE

      - name: Display summary table
        if: always()
        run: |
          python - <<'EOF'
          import os
          import csv

          summary_file = "results/summary.csv"
          if not os.path.exists(summary_file):
              print("No summary.csv found")
              exit(0)

          with open(summary_file) as f:
              rows = list(csv.DictReader(f))

          if not rows:
              print("Empty summary")
              exit(0)

          row = rows[0]

          def fv(key):
              try:
                  return float(row.get(key, 0))
              except:
                  return 0.0

          fields = [
              ("Initial Capital",        "initial_capital",       "${:,.2f}"),
              ("Final Equity",           "final_equity",          "${:,.2f}"),
              ("Total Return",           "total_return_pct",      "{:+.2f}%"),
              ("Max Drawdown",           "max_drawdown_pct",      "{:.2f}%"),
              ("Total Baskets",          "total_baskets",         "{:.0f}"),
              ("Win Rate",               "win_rate_pct",          "{:.1f}%"),
              ("Profit Factor",          "profit_factor",         "{:.2f}"),
              ("Avg Win (USD)",           "avg_win_usd",          "${:,.2f}"),
              ("Avg Loss (USD)",          "avg_loss_usd",         "${:,.2f}"),
              ("Avg Levels/Basket",      "avg_levels_per_basket", "{:.2f}"),
              ("Emergency Exits",        "emergency_exits",       "{:.0f}"),
              ("Total P&L",              "total_pnl_usd",         "${:+,.2f}"),
          ]

          print("\n" + "="*52)
          print("  BACKTEST RESULTS")
          print("="*52)
          for label, key, fmt in fields:
              val = row.get(key, "N/A")
              try:
                  formatted = fmt.format(float(val))
              except:
                  formatted = str(val)
              print(f"  {label:<26} {formatted}")
          print("="*52)

          # GitHub Step Summary
          sp = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if sp:
              with open(sp, "a") as f:
                  f.write("## 📊 Backtest Results\n\n")
                  f.write("| Metric | Value |\n|--------|-------|\n")
                  for label, key, fmt in fields:
                      val = row.get(key, "N/A")
                      try:
                          formatted = fmt.format(float(val))
                      except:
                          formatted = str(val)
                      f.write(f"| {label} | {formatted} |\n")
          EOF

      - name: Save run metadata
        if: always()
        run: |
          python - <<'EOF'
          import json, os
          from datetime import datetime, timezone

          info = {
              "run_date":     datetime.now(timezone.utc).isoformat(),
              "commit_sha":   os.environ.get("GITHUB_SHA", "")[:8],
              "ref":          os.environ.get("GITHUB_REF_NAME", ""),
              "actor":        os.environ.get("GITHUB_ACTOR", ""),
              "run_id":       os.environ.get("GITHUB_RUN_ID", ""),
              "start_date":   "${{ steps.params.outputs.start }}",
              "end_date":     "${{ steps.params.outputs.end }}",
              "pairs":        "${{ steps.params.outputs.pairs }}",
              "capital":      "${{ steps.params.outputs.capital }}",
              "elapsed_secs": "${{ steps.run_backtest.outputs.elapsed_seconds }}",
          }

          os.makedirs("results", exist_ok=True)
          with open("results/run_info.json", "w") as f:
              json.dump(info, f, indent=2)
          print(json.dumps(info, indent=2))
          EOF

      - name: Upload all results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-results-${{ github.run_id }}
          path: results/
          retention-days: 90

      - name: Upload charts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: charts-${{ github.run_id }}
          path: results/*.png
          retention-days: 90

  # ─────────────────────────────────────────────
  # JOB 4: Analyze Results
  # ─────────────────────────────────────────────
  analyze:
    name: Analyze Results
    runs-on: ubuntu-latest
    needs: backtest
    if: always() && needs.backtest.result == 'success'
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          name: backtest-results-${{ github.run_id }}
          path: results/

      - name: Quality checks
        id: quality
        run: |
          python - <<'EOF'
          import os, csv, sys

          summary_file = "results/summary.csv"
          if not os.path.exists(summary_file):
              print("No summary.csv - skipping")
              sys.exit(0)

          with open(summary_file) as f:
              row = list(csv.DictReader(f))[0]

          def fv(key):
              try:
                  return float(row.get(key, 0))
              except:
                  return 0.0

          checks = {
              "win_rate >= 60%":           fv("win_rate_pct")         >= 60.0,
              "max_drawdown <= 25%":       fv("max_drawdown_pct")     <= 25.0,
              "profit_factor >= 1.0":      fv("profit_factor")        >= 1.0,
              "return > -20%":             fv("total_return_pct")     > -20.0,
              "avg_levels <= 4":           fv("avg_levels_per_basket")<= 4.0,
              "baskets >= 10":             fv("total_baskets")        >= 10,
              "emergency_rate <= 15%": (
                  fv("emergency_exits") /
                  max(fv("total_baskets"), 1) * 100 <= 15.0
              ),
          }

          warnings = {
              "⚠️  max_dd > 15%":         fv("max_drawdown_pct")     > 15.0,
              "⚠️  win_rate < 70%":        fv("win_rate_pct")         < 70.0,
              "⚠️  profit_factor < 1.5":   fv("profit_factor")        < 1.5,
              "⚠️  avg_levels > 3":        fv("avg_levels_per_basket")> 3.0,
          }

          print("\n── Quality Checks ───────────────────────────")
          passed, failed = 0, 0
          for name, ok in checks.items():
              icon = "✅" if ok else "❌"
              print(f"  {icon} {name}")
              if ok: passed += 1
              else:  failed += 1

          print(f"\n  Result: {passed}/{len(checks)} passed")

          print("\n── Warnings ─────────────────────────────────")
          any_warn = False
          for name, condition in warnings.items():
              if condition:
                  print(f"  {name}")
                  any_warn = True
          if not any_warn:
              print("  No warnings")

          # Step summary
          sp = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if sp:
              with open(sp, "a") as f:
                  f.write("\n## ✅ Quality Checks\n\n")
                  f.write("| Check | Result |\n|-------|--------|\n")
                  for name, ok in checks.items():
                      f.write(f"| {name} | {'✅ PASS' if ok else '❌ FAIL'} |\n")
                  f.write(f"\n**{passed}/{len(checks)} passed**\n")

          go = os.environ.get("GITHUB_OUTPUT", "")
          if go:
              with open(go, "a") as f:
                  f.write(f"passed={passed}\n")
                  f.write(f"failed={failed}\n")
                  f.write(f"quality_ok={'true' if failed == 0 else 'false'}\n")
          EOF

      - name: Yearly breakdown
        run: |
          python - <<'EOF'
          import os, csv
          from collections import defaultdict

          basket_file = "results/basket_log.csv"
          if not os.path.exists(basket_file):
              print("No basket_log.csv")
              exit(0)

          with open(basket_file) as f:
              baskets = list(csv.DictReader(f))

          if not baskets:
              print("Empty basket log")
              exit(0)

          # By pair
          by_pair = defaultdict(list)
          by_dir  = defaultdict(list)
          by_year = defaultdict(list)
          by_reason = defaultdict(int)

          for b in baskets:
              pnl  = float(b.get("pnl_usd", 0))
              pair = b.get("pair", "?")
              dirn = b.get("direction", "?")
              ot   = b.get("open_time", "")
              year = ot[:4] if len(ot) >= 4 else "?"
              rsn  = b.get("close_reason", "?")

              by_pair[pair].append(pnl)
              by_dir[dirn].append(pnl)
              by_year[year].append(pnl)
              by_reason[rsn] += 1

          def stats(pnls):
              total = len(pnls)
              wins  = sum(1 for p in pnls if p > 0)
              wr    = wins / total * 100 if total else 0
              pnl_s = sum(pnls)
              return total, wr, pnl_s

          print("\n── By Pair ──────────────────────────────────")
          for pair, pnls in sorted(by_pair.items()):
              n, wr, pnl_s = stats(pnls)
              print(f"  {pair:10} {n:5d} baskets | WR {wr:5.1f}% | P&L ${pnl_s:+,.2f}")

          print("\n── By Direction ─────────────────────────────")
          for d, pnls in sorted(by_dir.items()):
              n, wr, pnl_s = stats(pnls)
              print(f"  {d:6} {n:5d} baskets | WR {wr:5.1f}% | P&L ${pnl_s:+,.2f}")

          print("\n── By Year ──────────────────────────────────")
          print(f"  {'Year':<6} {'Count':>6} {'WinRate':>9} {'P&L':>12}")
          print("  " + "-"*37)
          for year in sorted(by_year.keys()):
              n, wr, pnl_s = stats(by_year[year])
              print(f"  {year:<6} {n:>6} {wr:>8.1f}% ${pnl_s:>+11,.2f}")

          print("\n── Exit Reasons ─────────────────────────────")
          total_b = len(baskets)
          for rsn, cnt in sorted(by_reason.items(), key=lambda x: -x[1]):
              pct = cnt / total_b * 100
              print(f"  {rsn:22} {cnt:5d} ({pct:.1f}%)")
          EOF

  # ─────────────────────────────────────────────
  # JOB 5: Final Status
  # ─────────────────────────────────────────────
  final-status:
    name: Final Status Report
    runs-on: ubuntu-latest
    needs: [unit-tests, backtest, analyze]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Report
        run: |
          python - <<'EOF'
          import os

          results = {
              "Unit Tests": "${{ needs.unit-tests.result }}",
              "Backtest":   "${{ needs.backtest.result }}",
              "Analysis":   "${{ needs.analyze.result }}",
          }

          icons = {
              "success":   "✅",
              "failure":   "❌",
              "skipped":   "⏭️",
              "cancelled": "🚫",
          }

          run_url = (
              f"https://github.com/"
              f"{os.environ.get('GITHUB_REPOSITORY','')}"
              f"/actions/runs/"
              f"{os.environ.get('GITHUB_RUN_ID','')}"
          )

          print("="*50)
          print("  PIPELINE FINAL STATUS")
          print("="*50)
          all_ok = True
          for job, result in results.items():
              icon = icons.get(result, "❓")
              print(f"  {icon} {job:<15} {result}")
              if result not in ("success", "skipped"):
                  all_ok = False

          overall = "✅ ALL PASSED" if all_ok else "❌ SOME FAILED"
          print(f"\n  Overall: {overall}")
          print(f"  URL:     {run_url}")
          print("="*50)

          sp = os.environ.get("GITHUB_STEP_SUMMARY", "")
          if sp:
              with open(sp, "a") as f:
                  f.write(f"\n## Pipeline: {overall}\n\n")
                  f.write("| Job | Status |\n|-----|--------|\n")
                  for job, result in results.items():
                      icon = icons.get(result, "❓")
                      f.write(f"| {job} | {icon} {result} |\n")
                  f.write(f"\n[🔗 View Run]({run_url})\n")
          EOF
