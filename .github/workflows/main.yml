name: Professional Forex Backtest

# مشخص کردن زمان‌های اجرای بک‌تست
on:
  workflow_dispatch: # این خط بهت اجازه میده دستی از پنل گیت‌هاب ران بگیری

jobs:
  run-strategy:
    runs-on: ubuntu-latest # استفاده از سرورهای لینوکسی گیت‌هاب

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip' # کش کردن کتابخونه‌ها برای سرعت بیشتر در دفعات بعدی

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas backtrader

    - name: Run Backtest Pipeline
      run: |
        # اجرای کد و ذخیره خروجی همزمان در کنسول و یک فایل تکست
        python main.py | tee backtest_report.txt

    - name: Upload Backtest Report
      uses: actions/upload-artifact@v4
      with:
        name: Backtest-Results
        path: backtest_report.txt
        retention-days: 7 # فایل گزارش تا ۷ روز در گیت‌هاب باقی می‌ماند
