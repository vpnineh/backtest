name: Adaptive EA Backtest


on:

  workflow_dispatch:


jobs:

  test:

    runs-on: ubuntu-latest


    steps:


    - name: Checkout
      uses: actions/checkout@v4



    - name: Setup Python
      uses: actions/setup-python@v5

      with:

        python-version: "3.11"



    - name: Install

      run:

        pip install pandas numpy



    - name: Run Backtest

      run:

        python -u main.py



    - name: Upload Results

      uses: actions/upload-artifact@v4

      with:

        name: backtest-results

        path: results/
