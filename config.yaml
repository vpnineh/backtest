# =====================================================================
# Hedge-Grid Strategy - Research Backtest Configuration
# =====================================================================

data:
  symbol: "EURGBP"
  path: "data"                
  file_pattern: "*M12025*.zip"       
  start_date: "2025-01-01"
  end_date: "2025-12-31"
  datetime_column: "auto"
  timezone: "UTC"
  sim_timeframe: "5T"         # 5T = 5 Minutes. Strategy checks at M5, execution runs on M1.

execution:
  max_workers: 4              # Number of parallel CPU cores to use for batch/optimization runs

strategy:
  initial_lot: 0.10
  scale_factor: 1.20          
  grid_distance_pips: 15.0
  max_levels: 10
  grid_mode: "fixed"          
  atr_period: 14
  atr_multiplier: 1.0
  pip_size: 0.0001            
  contract_size: 100000.0

exit:
  mode: "A"                   
  target_profit: 50.0         
  convergence_pips: 2.0       
  equilibrium_buffer_pips: 1.0  

costs:
  commission_per_lot: 7.0     
  spread_pips: 1.2
  slippage_pips: 0.2
  swap_long_per_lot: -0.5
  swap_short_per_lot: 0.2

account:
  starting_balance: 10000.0
  leverage: 100.0
  currency: "USD"
  margin_call_level: 50.0
  quote_to_account_rate: 1.27

output:
  results_dir: "results"
  generate_charts: true
  save_trade_log: true
  save_cycle_log: true
  report_name: "simulation_report"
